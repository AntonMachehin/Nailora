case'verify':return title('Подтверди почту','В настоящем приложении здесь будет подтверждение email.')+card(`<div class="empty">${svg('check')}<h3>Демонстрационное подтверждение</h3><p class="sub">Письмо не отправляется.</p></div>`)+btn('Открыть профиль','login');
case'reset':return back('go:login')+title('Восстановление пароля','В демо письма не отправляются.')+field('Email','email','','email')+btn('Отправить ссылку (демо)','reset');
case'search':{const cat=['Все направления','Маникюр и педикюр','Брови и ресницы','Парикмахерские услуги'];let ids=masters.map((x,i)=>i).filter(i=>s.category==='Все направления'||masters[i].category===s.category);return `<div class="hero"><p class="eyebrow">Найди своего мастера</p><h1>Красота начинается с твоего мастера.</h1><p class="sub">Выбирай. Записывайся. Наслаждайся.</p></div><div class="section-line"><button class="text-btn" data-a="go:location">${esc(s.country)} · ${esc(s.city)} ⌄</button><span class="sub">Твой город</span></div>${select('Направление','category',cat,s.category)}${btn('Найти мастеров','search')}${link('Мой город','go:location')}<div class="section-line"><h2>Мастера рядом</h2><span class="sub">${ids.length} в демо</span></div>${ids.map(person).join('')||empty('Нет мастеров в этой категории')}`;}
case'location':return back('go:search')+title('Твой город','Выбери место поиска')+select('Страна','country',['Россия','Германия','Казахстан'],s.country)+field('Город','city',s.city)+btn('Сохранить','location');
case'master':return back('go:search')+title(m.name,m.type+' · '+s.city)+card(`<div class="row">${avatar(m.initial,'big')}<div class="grow"><h3>${esc(m.category)}</h3><p class="sub">${esc(m.place)}</p><p class="sub">${esc(m.desc)}</p></div></div><div class="rule"></div>${btn(s.favorites.includes(s.selectedMaster)?'♥ В моих мастерах':'♡ В мои мастера','favorite','secondary')}`,'soft')+`<h2>Услуги и цены</h2>`+m.services.map((v,i)=>`<button class="radio-row ${i===s.service?'on':''}" data-a="service:${i}"><span><strong>${esc(v.name)}</strong><br><span class="sub">${v.duration} мин</span></span><span class="price">${money(v.price)}</span></button>`).join('')+btn('Выбрать время','go:booking');
case'booking':return back('go:master')+title('Запись к мастеру')+card(`<div class="row">${avatar(m.initial)}<div class="grow"><h3>${esc(m.name)}</h3><p class="sub">${esc(sv.name)} · ${sv.duration} мин</p><p class="price">${money(sv.price)}</p></div></div>`)+`<h2>Выбери дату</h2>`+calendar()+`<h2>Доступное время</h2><p class="sub">${dateText(s.day)} · Демонстрационные слоты</p><div class="chips">${['10:00','12:00','15:30','17:00'].map(t=>chip(t,'time:'+t,t===s.time)).join('')}</div>`+btn('Продолжить','go:confirm');
case'confirm':return back('go:booking')+title('Проверь запись','Остался один шаг')+card(`<div class="row">${avatar(m.initial)}<div><h3>${esc(m.name)}</h3><p class="sub">${esc(sv.name)}</p></div></div><div class="rule"></div><h3>${dateText(s.day)} · ${esc(s.time)}</h3><p class="sub">${sv.duration} мин · ${money(sv.price)}</p>`)+area('Комментарий','note',s.note)+btn('Подтвердить запись','confirm')+btn('Назад','go:booking','outline');
case'success':return title('Ты записан(а)!','Встреча добавлена в демонстрационный календарь.')+card(`<div class="empty">${svg('check')}<h3>${esc(m.name)} · ${dateText(s.day)}</h3><p class="sub">${esc(s.time)} · ${esc(sv.name)}</p></div>`,'soft')+btn('Мои записи','go:bookings')+btn('На главную','go:search','outline');
case'favorites':return title('Мои мастера','Любимые специалисты всегда рядом')+(s.favorites.length?s.favorites.map(person).join(''):empty('Пока нет избранных мастеров'))+btn('Найти мастера','go:search','secondary');
case'bookings':{let list=s.bookings.filter(x=>s.history?x.status!=='booked':x.status==='booked');return title('Мои записи','Все визиты в одном месте')+`<div class="chips">${chip('Предстоящие','history:0',!s.history)}${chip('История','history:1',s.history)}</div>`+(list.length?list.map(x=>card(`<div class="row spread"><span class="eyebrow" style="margin:0">${dateText(x.date)} · ${x.time}</span>${pill(x.status==='booked'?'Подтверждена':x.status==='completed'?'Завершена':'Отменена',x.status==='cancelled'?'bad':'ok')}</div><h3 style="margin:10px 0 4px">${esc(x.service)}</h3><p class="sub">${esc(masters[x.master].name)} · ${money(x.price)}</p>${x.note?`<p class="sub">${esc(x.note)}</p>`:''}${x.status==='booked'?`<div class="rule"></div><div class="row spread">${link('Изменить','editBooking:'+x.id)}${link('Отменить','cancelBooking:'+x.id)}</div>`:''}`)).join(''):empty('Записей пока нет'))+btn('Найти мастера','go:search','secondary');}
case'profile':return title('Мой профиль',s.role==='master'?'Управление кабинетом':'Твоё личное пространство')+card(`<div class="row">${avatar((s.role==='master'?s.masterName:s.name)[0]||'М','big')}<div class="grow"><h3>${esc(s.role==='master'?s.masterName:s.name)}</h3><p class="sub">${esc(s.role==='master'?'Мастер маникюра':'Клиент')} · ${esc(s.city)}</p></div></div>`,'soft')+card((s.role==='master'?rowLink('Услуги и цены','Управление каталогом','spark','go:services')+rowLink('Рабочее время','Расписание и выходные','clock','go:work'):'')+rowLink('Настройки аккаунта','Имя, город, язык','settings','go:settings')+rowLink('Уведомления','Напоминания о записях','bell','go:notifications'))+btn('Выйти из аккаунта','logout','outline')+btn('Сменить роль в демо','go:welcome','secondary');
case'settings':return back('go:profile')+title('Настройки','Данные профиля')+field('Имя','name',s.role==='master'?s.masterName:s.name)+select('Страна','country',['Россия','Германия','Казахстан'],s.country)+field('Город','city',s.city)+select('Язык','language',['Русский','English','Deutsch'],s.language)+btn('Сохранить','settings');
case'notifications':return back('go:profile')+title('Уведомления','Всё важное в одном месте')+card(`<div class="row spread"><div><h3>Напоминания</h3><p class="sub">Демонстрационная настройка</p></div><button class="switch ${s.notify?'on':''}" data-a="toggleNotify" role="switch" aria-checked="${s.notify}" aria-label="Напоминания"></button></div>`)+info('Предстоящий визит','Не забудь про запись 28 ноября')+info('Добро пожаловать в My Beauty','Это пример уведомления');
case'calendar':{const list=s.masterBookings.filter(x=>x.date===s.day&&x.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time));return title('Доброе утро, '+s.masterName,'Твой рабочий день')+`<div class="chips">${pill(list.length+' записи')}${pill(money(list.reduce((a,x)=>a+x.price,0)))}</div>`+calendar()+`<div class="section-line"><h2>${dateText(s.day)}</h2>${link(s.daysOff.includes(s.day)?'Рабочий день':'Выходной','toggleDayOff')}</div>`+(list.length?list.map(x=>`<div class="timeline"><span class="time">${esc(x.time)}</span><button class="radio-row" data-a="record:${x.id}"><span><strong>${esc(x.name)}</strong><br><span class="sub">${esc(x.service)} · ${money(x.price)}</span></span>${pill(x.paid?'Оплачено':x.status==='completed'?'Завершена':'Запись',x.paid?'ok':'')}</button></div>`).join(''):empty('Нет записей на этот день'))+btn('Новая запись','newRecord');}
case'record':{const x=s.masterBookings.find(a=>a.id===s.selectedRecord);if(!x)return title('Запись не найдена')+btn('Календарь','go:calendar');return back('go:calendar')+title('Запись клиента',dateText(x.date)+' · '+x.time)+card(`<div class="row">${avatar(x.name[0])}<div><h3>${esc(x.name)}</h3><p class="sub">${esc(x.service)}</p></div></div><div class="rule"></div><div class="row spread"><span class="price">${money(x.price)}</span>${pill(x.paid?'Оплачено':'Не оплачено',x.paid?'ok':'')}</div>`)+area('Комментарий','note',x.note)+btn('Сохранить комментарий','saveNote','secondary')+(x.paid?info('Оплачено','Оплата уже отмечена',pill('✓','ok')):btn('Отметить оплату','paid'))+(x.status==='completed'?info('Визит завершён','Запись сохранена в истории'):btn('Завершить визит','complete','secondary'))+btn('Напомнить клиенту','remind','outline')+btn('Изменить запись','editRecord','outline')+btn('Отменить запись','cancelRecord','danger');}
case'newRecord':{let x=s.editId?s.masterBookings.find(a=>a.id===s.editId):null;return back('go:calendar')+title(x?'Изменить запись':'Новая запись','Запись клиента в календарь')+field('Имя клиента','clientName',x?.name||'')+select('Услуга','serviceName',s.services.map(v=>v.name),x?.service||s.services[0]?.name)+field('Дата','date',x?.date||s.day,'date')+field('Время','time',x?.time||'12:00','time')+field('Стоимость, ₽','price',x?.price||s.services[0]?.price||0,'number','min="0"')+area('Комментарий','note',x?.note||'')+btn('Сохранить запись','saveRecord');}
case'clients':return title('Клиенты','Твоя клиентская база')+field('Поиск','clientFilter','','search','placeholder="Имя клиента"')+`<div id="client-list">${s.clients.map(n=>info(n,'Клиент · Демонстрация')).join('')}</div>`+btn('Добавить клиента','go:newClient');
case'newClient':return back('go:clients')+title('Новый клиент')+field('Имя','name','')+btn('Сохранить','newClient');
case'finance':{const income=45000+s.masterBookings.filter(x=>x.paid).reduce((a,x)=>a+x.price,0),expense=s.expenses.reduce((a,x)=>a+x.amount,0);return title('Финансы','Ноябрь 2026 · Пример отчёта')+card(`<p class="sub">Доход</p><div class="metric">${money(income)}</div><div class="rule"></div><div class="row spread"><span class="sub">Расходы</span><strong>${money(expense)}</strong></div><div class="rule"></div><div class="row spread"><span class="sub">Прибыль</span><strong style="color:var(--green)">${money(income-expense)}</strong></div>`)+`<h2>Расходы</h2>`+s.expenses.map(x=>info(x.name,dateText(x.date),`<strong>− ${money(x.amount)}</strong>`)).join('')+btn('Добавить расход','go:expense');}
case'expense':return back('go:finance')+title('Добавить расход')+field('Название','expenseName','')+field('Сумма, ₽','amount','','number','min="1"')+field('Дата','date',s.day,'date')+btn('Сохранить','expense');
case'services':return back('go:profile')+title('Услуги и цены','Твой каталог')+s.services.map((x,i)=>info(x.name,`${x.duration} мин · ${money(x.price)}`,link('Изменить','editService:'+i))).join('')+btn('Добавить услугу','newService');
case'serviceEdit':{const x=s.editId===null?null:s.services[s.editId];return back('go:services')+title(x?'Изменить услугу':'Новая услуга')+field('Название','serviceName',x?.name||'')+field('Длительность, мин','duration',x?.duration||90,'number','min="15"')+field('Стоимость, ₽','price',x?.price||1500,'number','min="0"')+btn('Сохранить','saveService');}
case'work':return back('go:profile')+title('Рабочее время','Расписание и выходные')+field('Начало рабочего дня','workStart',s.workStart,'time')+field('Конец рабочего дня','workEnd',s.workEnd,'time')+`<h2>Выходные</h2>`+calendar(true)+btn(s.daysOff.includes(s.day)?'Сделать день рабочим':'Отметить выходной','toggleDayOff','secondary')+btn('Сохранить расписание','saveWork');
default:return title('My Beauty')+btn('На главную','go:welcome');}}
function render(){const auth=authScreens.includes(s.screen),root=$('#app');root.classList.toggle('auth',auth);root.innerHTML=header(auth)+`<section class="body">${view()}<p class="footer-note">Эксперимент · данные только в памяти этой страницы</p></section>`+(auth?'':nav());}
const value=id=>$('#'+id)?.value||'', num=id=>Number(value(id));
function action(a){let i=a.indexOf(':'),key=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);switch(key){case'go':if(v==='master'&&s.role==='master')v='profile';setScreen(v);break;case'role':s.role=v;setScreen('login');break;case'login':setScreen(s.role==='master'?'calendar':'search');toast('Демонстрационный профиль открыт');break;case'register':if(!$('#privacy').checked){toast('Подтверди согласие');return}if(value('name')){if(s.role==='master')s.masterName=value('name');else s.name=value('name')}s.country=value('country');s.city=value('city')||s.city;setScreen('verify');break;case'reset':toast('Демо: письмо не отправлено');break;case'search':s.category=value('category');render();toast('Каталог обновлён');break;case'location':s.country=value('country');s.city=value('city')||s.city;setScreen('search');break;case'master':s.selectedMaster=Number(v);s.service=0;s.editId=null;s.note='';setScreen('master');break;case'favorite':s.favorites=s.favorites.includes(s.selectedMaster)?s.favorites.filter(x=>x!==s.selectedMaster):[...s.favorites,s.selectedMaster];render();break;case'service':s.service=Number(v);render();break;case'day':if(s.screen==='work'){s.workStart=value('workStart')||s.workStart;s.workEnd=value('workEnd')||s.workEnd} s.day=v;render();break;case'month':{const d=new Date(s.year,s.month+Number(v),1);s.year=d.getFullYear();s.month=d.getMonth();render();break}case'time':s.time=v;render();break;case'confirm':{s.note=value('note');const m=masters[s.selectedMaster],sv=m.services[s.service];const x={id:s.editId??Date.now(),master:s.selectedMaster,service:sv.name,date:s.day,time:s.time,price:sv.price,note:s.note,status:'booked'};s.bookings=s.bookings.filter(q=>q.id!==x.id).concat(x);s.editId=null;setScreen('success');break}case'history':s.history=v==='1';render();break;case'editBooking':{const x=s.bookings.find(q=>q.id===Number(v));if(!x)return;s.editId=x.id;s.selectedMaster=x.master;s.service=Math.max(0,masters[x.master].services.findIndex(z=>z.name===x.service));s.day=x.date;let d=new Date(x.date+'T12:00:00');s.year=d.getFullYear();s.month=d.getMonth();s.time=x.time;s.note=x.note;setScreen('booking');break}case'cancelBooking':{let x=s.bookings.find(q=>q.id===Number(v));if(x&&confirm('Отменить демонстрационную запись?')){x.status='cancelled';render();toast('Запись отменена')}break}case'settings':if(value('name')){if(s.role==='master')s.masterName=value('name');else s.name=value('name')}s.country=value('country');s.city=value('city')||s.city;s.language=value('language');setScreen('profile');toast('Настройки сохранены в демо');break;case'toggleNotify':s.notify=!s.notify;render();break;case'logout':s.role=null;setScreen('welcome');break;case'toggleDayOff':s.daysOff=s.daysOff.includes(s.day)?s.daysOff.filter(x=>x!==s.day):[...s.daysOff,s.day];render();break;case'record':s.selectedRecord=Number(v);setScreen('record');break;case'newRecord':s.editId=null;setScreen('newRecord');break;case'editRecord':s.editId=s.selectedRecord;setScreen('newRecord');break;case'saveRecord':{const name=value('clientName').trim();if(!name||!value('date')||!value('time')||num('price')<0){toast('Заполни поля');return}let old=s.masterBookings.find(x=>x.id===s.editId);let x={id:s.editId??Date.now(),name,service:value('serviceName'),date:value('date'),time:value('time'),price:num('price'),note:value('note'),status:old?.status||'booked',paid:old?.paid||false};s.masterBookings=s.masterBookings.filter(q=>q.id!==x.id).concat(x);if(!s.clients.includes(name))s.clients.push(name);s.day=x.date;let d=new Date(x.date+'T12:00:00');s.month=d.getMonth();s.year=d.getFullYear();s.editId=null;setScreen('calendar');toast('Запись сохранена');break}case'saveNote':{const x=s.masterBookings.find(q=>q.id===s.selectedRecord);if(x)x.note=value('note');toast('Комментарий сохранён');break}case'paid':{let x=s.masterBookings.find(q=>q.id===s.selectedRecord);if(x)x.paid=true;render();toast('Оплачено');break}case'complete':{let x=s.masterBookings.find(q=>q.id===s.selectedRecord);if(x)x.status='completed';render();toast('Визит завершён');break}case'remind':toast('Демо: напоминание не отправляется');break;case'cancelRecord':{let x=s.masterBookings.find(q=>q.id===s.selectedRecord);if(x&&confirm('Отменить демонстрационную запись?')){x.status='cancelled';setScreen('calendar');toast('Запись отменена')}break}case'newClient':if(value('name').trim()){s.clients.push(value('name').trim());setScreen('clients')}else toast('Введи имя');break;case'expense':if(!value('expenseName').trim()||num('amount')<=0||!value('date')){toast('Заполни поля');break}s.expenses.push({name:value('expenseName').trim(),amount:num('amount'),date:value('date')});setScreen('finance');toast('Расход добавлен');break;case'newService':s.editId=null;setScreen('serviceEdit');break;case'editService':s.editId=Number(v);setScreen('serviceEdit');break;case'saveService':{if(!value('serviceName').trim()||num('duration')<=0||num('price')<0){toast('Заполни поля');break}let x={name:value('serviceName').trim(),duration:num('duration'),price:num('price')};if(s.editId===null)s.services.push(x);else s.services[s.editId]=x;s.editId=null;setScreen('services');toast('Услуга сохранена');break}case'saveWork':if(value('workStart')>=value('workEnd')){toast('Проверь рабочее время');break}s.workStart=value('workStart');s.workEnd=value('workEnd');setScreen('profile');toast('Расписание сохранено');break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)action(b.dataset.a)});document.addEventListener('input',e=>{if(e.target.id==='clientFilter'){let q=e.target.value.toLowerCase();$('#client-list').innerHTML=s.clients.filter(x=>x.toLowerCase().includes(q)).map(n=>info(n,'Клиент · Демонстрация')).join('')||empty('Ничего не найдено')}});document.addEventListener('change',e=>{if(e.target.id==='serviceName'&&s.screen==='newRecord'){let x=s.services.find(x=>x.name===e.target.value);if(x)$('#price').value=x.price}});render();
</script></body></html>
